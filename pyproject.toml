[project]
name = "igniteroom"
version = "0.1.0"
description = "Company Brain — Cognee + Neo4j Knowledge Graph Q&A for Nexora Technologies"
readme = "README.md"
authors = [
    { name = "Yosuf20", email = "jyosuf6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Knowledge graph + LLM
    "cognee[neo4j,fastembed]>=0.1.39",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Config
    "python-dotenv>=1.0.0",
    # Data parsing
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    # Neo4j direct driver
    "neo4j>=5.20.0",
    # HTTP
    "httpx>=0.27.0",
]

[project.scripts]
igniteroom = "igniteroom:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
